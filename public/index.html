async function api(path,opt={}){
  const r=await fetch("/api"+path,{method:opt.method||"GET",headers:{"Content-Type":"application/json",...(T?{Authorization:"Bearer "+T}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Something went wrong. Try again.");
  return j}

async function loadBk(){try{S.bk=await api("/bookings")}catch(e){S.msg=["err",e.message]}}
async function loadAdminSection(section){

}

function adminTableBody(){
const rows=S.adminRows, query=S.adminSearch.toLowerCase();
let headers=[], data=[];
if(S.adminTab==="users"){
headers=["Name","Email","Account type","Joined"];
data=rows.filter(r=>(r.name+r.email+r.role+r.created).toLowerCase().includes(query))
  .map(r=>[esc(r.name),esc(r.email),r.isAdmin?"Admin":r.role==="consumer"?"Client":"Provider",esc(r.created||"—")]);
}else if(S.adminTab==="providers"){
headers=["Provider","Category","City","Starting rate","Account email","Rating"];
data=rows.filter(r=>(r.name+r.cat+r.city+(r.accountEmail||"")+r.rating).toLowerCase().includes(query))
  .map(r=>[esc(r.name),esc(r.cat),esc(r.city),peso(r.rate),esc(r.accountEmail||"No linked account"),esc(r.rating)]);
}else if(S.adminTab==="messages"){
const messages=rows.filter(r=>(r.senderName+r.senderEmail+r.senderRole+r.subject+r.message+r.created).toLowerCase().includes(query));
return messages.length?messages.map(m=>`<article class="admin-message"><div class="row" style="margin-top:0"><b>${esc(m.senderName)} · ${m.senderRole==="consumer"?"Client":"Provider"}</b><span class="mute sm">${esc(m.created)}</span></div><div class="mute sm">${esc(m.senderEmail)}</div><h3>${esc(m.subject)}</h3><p>${esc(m.message)}</p></article>`).join(""):`<div class="empty">${query?"No matching messages.":"No messages yet."}</div>`;

data=rows.filter(r=>(r.clientName+(r.clientEmail||"")+r.providerName+r.date+r.note+r.status+r.created).toLowerCase().includes(query))
  .map(r=>[`${esc(r.clientName)}<div class="mute sm">${esc(r.clientEmail||"")}</div>`,esc(r.providerName),esc(r.date),esc(r.note),`<span class="st ${esc(r.status)}">${esc(r.status)}</span>`,esc(r.created||"—")]);
}
return data.length?`<table class="admin-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${data.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`:`<div class="empty">${query?"No matching records.":"No records yet."}</div>`;
}

if(u.role==="provider")return providerDashboard();
return `<div class="wrap pg">${banner()}<h1 style="font-size:clamp(30px,5vw,44px)">My bookings</h1>
<div class="panel" style="margin-top:18px">${S.bk.length?S.bk.map(b=>`<div class="bk"><div><b>${esc(b.providerName)}</b> <span class="st ${esc(b.status)}">${esc(b.status)}</span><div class="mute sm">${esc(b.date)} · ${esc(b.note)}</div>${b.status==="Accepted"?`<div class="mute sm">Provider email: ${b.contactEmail?`<a href="mailto:${esc(b.contactEmail)}">${esc(b.contactEmail)}</a>`:"Not available"}</div>`:""}</div>${b.status==="Pending"?`<button class="btn bad sm" data-act="set" data-id="${b.id}" data-s="Cancelled">Cancel</button>`:b.status==="Accepted"&&!b.rating?`<form class="rating-form" id="rating-form-${b.id}"><label for="rating-${b.id}">Rate this creative</label><select id="rating-${b.id}" name="rating" required><option value="">Choose stars</option><option value="5">★★★★★ · Excellent</option><option value="4">★★★★ · Good</option><option value="3">★★★ · Okay</option><option value="2">★★ · Poor</option><option value="1">★ · Very poor</option></select><button class="btn sm" type="button" data-act="rate" data-id="${b.id}">Submit rating</button></form>`:b.rating?`<div class="rating-done">Your rating: ${"★".repeat(b.rating)}${"☆".repeat(5-b.rating)}</div>`:""}</div>`).join(""):`<div class="mute">You have no bookings yet. Browse creatives and send your first request.</div>`}</div>
<div style="margin-top:16px"><button class="btn" data-act="go" data-v="browse">Browse creatives</button></div></div>`}
function contactAdmin(){if(!S.user||S.user.isAdmin)return auth();return `<main class="wrap pg" style="max-width:720px">${banner()}<section class="panel"><span class="eyebrow">We’re here to help</span><h1 style="font-size:clamp(30px,5vw,44px);margin-top:8px">Contact the admin team</h1><p class="mute">Ask a question or share feedback. Your name and account email will be included so the admin team can follow up.</p><form data-form="admin-message"><label for="message-subject">Subject</label><input id="message-subject" name="subject" maxlength="100" required placeholder="What can we help with?"><label for="message-body">Message</label><textarea id="message-body" name="message" rows="7" maxlength="2000" required placeholder="Type your question or message here"></textarea><div style="margin-top:16px"><button class="btn" type="button" data-act="sendMessage">Send message</button></div></form></section></main>`}
function render(){const v=S.view;$("#app").innerHTML=nav()+(v==="browse"?browse():v==="detail"?detail():v==="auth"?auth():v==="admin"?adminDashboard():v==="contact"?contactAdmin():bookings())}
function saveToken(t){T=t;try{t?localStorage.setItem("cv_token",t):localStorage.removeItem("cv_token")}catch(e){}}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.theme;try{localStorage.setItem("cv_theme",S.theme)}catch(e){}render()}
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;$("#grid").innerHTML=cards()}else if(e.target.id==="admin-search"){S.adminSearch=e.target.value;$("#admin-table").innerHTML=adminTableBody()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("card"))e.target.click()});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act]");if(!t)return;const d=t.dataset,a=d.act,v=id=>($(id)||{}).value||"";
try{
if(a==="go")await go(d.v);
else if(a==="theme")toggleTheme();
else if(a==="dashTab"){S.dashTab=d.tab;render()}
else if(a==="adminTab"){await loadAdminSection(d.tab);render()}
else if(a==="sendMessage"){
  const form=$('[data-form="admin-message"]');
  if(!form.reportValidity())return;
  const body=Object.fromEntries(new FormData(form).entries());
  await api("/messages",{method:"POST",body});
  S.msg=["ok","Your message was sent to the admin team."];render()
}
else if(a==="listing"){S.listingEdit=!S.listingEdit;render()}
else if(a==="cancelListing"){S.listingEdit=false;render()}
else if(a==="saveListing"){
  const form=$('[data-form="listing"]');
  if(!form.reportValidity())return;
  const fd=new FormData(form),body=Object.fromEntries(fd.entries());
  body.rate=Number(body.rate);body.tags=String(body.tags).split(",").map(tag=>tag.trim()).filter(Boolean);
  const updated=await api("/provider/profile",{method:"PATCH",body});
  S.P=S.P.map(p=>p.id===updated.id?updated:p);S.listingEdit=false;S.msg=["ok","Your listing was updated."];render()
}
else if(a==="signup"){S.mode="up";S.role="consumer";S.msg=null;await go("auth")}
else if(a==="providerSignup"){S.mode="up";S.role="provider";S.msg=null;await go("auth")}
else if(a==="scroll")document.getElementById(d.target)?.scrollIntoView({behavior:"smooth"});
else if(a==="cat"){S.cat=d.c;render();if(t.closest(".hero"))document.getElementById("services")?.scrollIntoView({behavior:"smooth"})}
else if(a==="open"){S.sel=+d.id;await go("detail")}
else if(a==="out"){saveToken(null);S.user=null;S.bk=[];await go("browse")}
else if(a==="mode"){S.mode=S.mode==="up"?"in":"up";S.msg=null;render()}
else if(a==="role"){S.role=d.r;render()}
else if(a==="set"){await api("/bookings/"+d.id,{method:"PATCH",body:{status:d.s}});await loadBk();S.msg=["ok",d.s==="Accepted"?"Booking accepted.":d.s==="Declined"?"Booking declined.":"Booking cancelled."];render()}
else if(a==="rate"){
  const form=document.getElementById("rating-form-"+d.id);
  if(!form.reportValidity())return;
  const rating=Number(new FormData(form).get("rating"));
  await api("/bookings/"+d.id+"/review",{method:"POST",body:{rating}});
  S.P=await api("/providers");await loadBk();
  S.msg=["ok","Thanks for rating this creative."];render()
}
else if(a==="book"){
  if(!S.user){S.after="detail";S.mode="in";await go("auth");return}
  const date=v("#d"),note=v("#n").trim();
  if(!date||!note){S.msg=["err","Choose a date and describe what you need."];render();return}
  await api("/bookings",{method:"POST",body:{providerId:S.sel,date,note}});
  S.view="bookings";await loadBk();S.msg=["ok","Request sent. The provider will reply here."];render();scrollTo(0,0)}
else if(a==="auth"){
  const body={email:v("#em"),password:v("#pw")};
  if(S.mode==="up"){body.name=v("#nm");body.role=S.role;body.category=v("#ct")||undefined}
  const r=await api(S.mode==="up"?"/signup":"/login",{method:"POST",body});
  saveToken(r.token);S.user=r.user;
  if(S.mode==="up"&&r.user.role==="provider")S.P=await api("/providers");
  const next=r.user.isAdmin?"admin":r.user.role==="provider"?"bookings":(S.after||"browse");S.after=null;await go(next)}
}catch(err){fail(err)}});
(async()=>{
  $("#app").innerHTML='<div class="wrap pg mute">Loading…</div>';
  try{S.P=await api("/providers")}catch(e){S.msg=["err","Could not load creatives. Refresh to try again."]}
  if(T){try{S.user=(await api("/me")).user}catch(e){saveToken(null)}}
  render()})();
</script></body></html>
